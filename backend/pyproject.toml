[project]
name = "code-review-agent"
version = "0.1.0"
description = "Multi-agent AI code review and security analysis backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "websockets>=13.0",
    # config & validation
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # database (beanie 2.x drives pymongo's AsyncMongoClient directly, no motor)
    "beanie>=2.1",
    # auth & crypto
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "cryptography>=43.0",
    # llm / agents
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-ollama>=0.2.1",
    "jinja2>=3.1",
    "tenacity>=9.0",
    # http client (github api, ollama probing, package registry checks)
    "httpx>=0.28",
    # static analysis
    "ruff>=0.8",
    "bandit>=1.8",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
]

[project.optional-dependencies]
# heavy + slow to install; the wrapper degrades gracefully when absent
semgrep = ["semgrep>=1.95"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["../samples", "../benchmarks/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
