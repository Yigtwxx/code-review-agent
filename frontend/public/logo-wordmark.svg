<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" fill="none" role="img" aria-label="Code Review Agent">
  <!--
    Horizontal lockup for READMEs and docs headers.

    It carries its own dark plate rather than sitting on the page background:
    GitHub renders a README under either theme, and the mark is bone white.
    Type is left as live <text> so the file stays editable - the stack degrades
    to the host's UI sans-serif if IBM Plex is not installed.
  -->
  <rect width="300" height="64" rx="14" fill="#0A0D14"/>
  <rect x="0.5" y="0.5" width="299" height="63" rx="13.5" stroke="#262C38"/>

  <g transform="translate(24 16)">
    <rect x="4" y="5" width="3" height="22" rx="1.5" fill="#ECEFF4"/>
    <rect x="11" y="6" width="17" height="3" rx="1.5" fill="#ECEFF4"/>
    <rect x="11" y="14.5" width="9" height="3" rx="1.5" fill="#ECEFF4"/>
    <circle cx="25" cy="16" r="2.75" fill="#2DD4BF"/>
    <rect x="11" y="23" width="13" height="3" rx="1.5" fill="#ECEFF4"/>
  </g>

  <text x="72" y="30" fill="#ECEFF4" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3">Code Review Agent</text>
  <text x="72" y="46" fill="#8B93A7" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="1.4">CROSS-VALIDATED REVIEW</text>
</svg>
