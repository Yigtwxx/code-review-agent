<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="Code Review Agent">
  <!--
    The mark, on a transparent plate, with the palette written out - for READMEs,
    OG images and anywhere the app's CSS variables are not in scope. In-app use
    the React component at src/components/ui/logo.tsx instead: it inherits the
    surrounding text colour.

    Left rail, three code lines. The middle line stops short and ends in the
    teal that means one thing across this whole product: a finding some
    deterministic tool reproduced independently of the model.
  -->
  <rect x="4" y="5" width="3" height="22" rx="1.5" fill="#ECEFF4"/>
  <rect x="11" y="6" width="17" height="3" rx="1.5" fill="#ECEFF4"/>
  <rect x="11" y="14.5" width="9" height="3" rx="1.5" fill="#ECEFF4"/>
  <circle cx="25" cy="16" r="2.75" fill="#2DD4BF"/>
  <rect x="11" y="23" width="13" height="3" rx="1.5" fill="#ECEFF4"/>
</svg>
